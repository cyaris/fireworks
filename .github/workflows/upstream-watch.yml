name: Upstream Watch

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-watch-production:
    concurrency:
      group: upstream-watch-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    uses: cyaris/shared-automation/.github/workflows/upstream-watch.yml@main
    with:
      dispatch-ref: main
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  upstream-watch-dev:
    concurrency:
      group: upstream-watch-dev
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    uses: cyaris/shared-automation/.github/workflows/upstream-watch.yml@main
    with:
      svelte-lib-ref: dev
      allow-nonproduction-refs: true
      dispatch-ref: dev
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
