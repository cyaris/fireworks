name: Upstream Watch

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-watch:
    concurrency:
      group: upstream-watch
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    uses: cyaris/shared-automation/.github/workflows/upstream-watch.yml@main
    with:
      dispatch-ref: main
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
